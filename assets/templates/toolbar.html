<!-- ================================================================
     Prototype Annotator — Toolbar HTML Fragment
     Injected at bottom of <body>
     ================================================================ -->
<div class="anno-toolbar-combo">
  <!-- Toggle Button -->
  <button class="anno-toggle-btn" id="annoToggleBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span class="anno-toggle-text">打开标注</span>
  </button>

  <!-- Toolbar -->
  <div class="anno-toolbar" id="annoToolbar">
    <div class="anno-status-indicator">
      <div class="anno-status-dot"></div>
      <span class="anno-status-text" id="annoModeText">查看模式</span>
    </div>
    
    <div class="anno-toolbar-divider"></div>
    
    <button class="anno-toolbar-btn active" id="annoViewBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <span class="anno-btn-label">查看</span>
    </button>
    
    <button class="anno-toolbar-btn" id="annoEditBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
      </svg>
      <span class="anno-btn-label">编辑</span>
    </button>
    
    <button class="anno-toolbar-btn" id="annoPanelBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <line x1="9" y1="3" x2="9" y2="21"/>
      </svg>
      <span class="anno-btn-label">面板</span>
    </button>
    
    <button class="anno-toolbar-btn" id="annoAddBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      <span class="anno-btn-label">新增</span>
    </button>
    
    <button class="anno-toolbar-btn" id="annoSaveBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
        <polyline points="7 3 7 8 15 8"/>
      </svg>
      <span class="anno-btn-label">保存</span>
    </button>

    <button class="anno-toolbar-btn" id="annoUndoBtn" title="撤销 (Ctrl+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
      </svg>
      <span class="anno-btn-label">撤销</span>
    </button>

    <button class="anno-toolbar-btn" id="annoRedoBtn" title="重做 (Ctrl+Y)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/>
      </svg>
      <span class="anno-btn-label">重做</span>
    </button>

    <button class="anno-toolbar-btn" id="annoExportBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span class="anno-btn-label">导出</span>
    </button>

    <button class="anno-toolbar-btn" id="annoImportBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <span class="anno-btn-label">导入</span>
    </button>

    <input type="file" id="annoImportFile" accept=".json" style="display:none">
  </div>
</div>
